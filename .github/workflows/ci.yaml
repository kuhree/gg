name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency: test
    strategy:
      matrix:
        go-version: ['1.24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: install deps
        run: go mod download

      - name: Test with Go
        run: go test -json ./... > TestResults-${{ matrix.go-version }}.json
      - name: upload test results
        uses: actions/upload-artifact@v3
        with:
          name: TestResults-${{ matrix.go-version }}
          path: TestResults-${{ matrix.go-version }}.json

  ci:
    runs-on: ubuntu-latest
    concurrency: flake
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/cachix/install-nix-action@v25
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: check and build flake
        uses: https://git.kuhree.com/kuhree/actions-flake-ci@v1
        with:
          artifact_name: gg.zip
          artifact_path: result

      - name: ntfy status
        uses: https://git.kuhree.com/kuhree/actions-ntfy@v1
        if: always()
        with:
          token: ${{ secrets.NTFY_API_TOKEN }}
          url: ${{ vars.NTFY_URL }}
          status: ${{ job.status }}
          title: WWW-KUHREE CI
